[project]
name = "polaris"
version = "0.1.0"
description = "Polaris - local-first AI file intelligence assistant"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "psutil>=5.9"]

[project.optional-dependencies]
docs = ["PyMuPDF>=1.24", "python-docx>=1.1"]
search = ["faiss-cpu>=1.8", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
polaris = "polaris.__main__:main"
sortpilot = "polaris.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyrefly]
python-interpreter = ".venv/Scripts/python.exe"

